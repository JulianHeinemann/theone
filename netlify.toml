# Landingpage + Web-App auf Netlify. Die API läuft auf Railway, /api wird dorthin weitergeleitet.
[build]
  publish = "netlify-dist"
  command = "node server/scripts/build-static.mjs"

[[redirects]]
  from = "/api/*"
  to = "https://api-production-9130.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://api-production-9130.up.railway.app/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

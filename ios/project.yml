name: Restwert
options:
  bundleIdPrefix: de.restwert
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
packages:
  RestwertKit:
    path: Packages/RestwertKit
targets:
  Restwert:
    type: application
    platform: iOS
    sources:
      - path: Restwert
    dependencies:
      - package: RestwertKit
      - target: RestwertWidget
      - target: RestwertShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.restwert.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Restwert-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Restwert
        INFOPLIST_KEY_NSCameraUsageDescription: Restwert nutzt die Kamera, um Barcodes und Text von Gutscheinen zu scannen und Fotos deiner Karten aufzunehmen.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Restwert speichert Bilder deiner Gutscheine auf Wunsch in deinen Fotos.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Restwert sperrt mit Face ID die App und die PINs deiner Gutscheinkarten.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Immer mit iCloud: ein Build ohne iCloud-Berechtigung stürzt beim ersten CloudKit-Zugriff ab.
        CODE_SIGN_ENTITLEMENTS: Restwert.entitlements
  RestwertWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RestwertWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.restwert.app.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RestwertWidget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Restwert
        CODE_SIGN_ENTITLEMENTS: RestwertWidget.entitlements
        SKIP_INSTALL: YES
  RestwertShare:
    # „Teilen“ → Restwert: Mail-Text, Fotos (bis 20), PDFs. Legt Dateien in die App Group, die App liest sie ein.
    type: app-extension
    platform: iOS
    sources:
      - path: RestwertShare
    dependencies:
      - package: RestwertKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.restwert.app.share
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RestwertShare-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Restwert
        CODE_SIGN_ENTITLEMENTS: RestwertShare.entitlements
        SKIP_INSTALL: YES

name: Restwert
options:
  bundleIdPrefix: de.restwert
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Restwert:
    type: application
    platform: iOS
    sources:
      - path: Restwert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.restwert.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Restwert-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Restwert
        INFOPLIST_KEY_NSCameraUsageDescription: Restwert nutzt die Kamera, um Barcodes und Text von Gutscheinen zu scannen.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Restwert schützt die PIN deiner Gutscheinkarten mit Face ID.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light

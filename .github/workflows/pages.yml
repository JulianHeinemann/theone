name: Webseite

# Veröffentlicht site/ (Startseite, Hilfe, Datenschutz, Impressum) auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source „GitHub Actions“.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Platzhalter prüfen
        run: |
          if grep -rl "\[Name\]\|\[Anschrift\]\|\[E-Mail\]" site; then
            echo "::warning::Impressum/Datenschutz enthalten noch Platzhalter. Vor der App-Store-Einreichung ersetzen."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

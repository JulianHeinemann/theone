<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impressum – Restwert</title><meta name="description" content="Impressum der App Restwert.">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><style>
:root{--page:#F6F4EF;--surface:#FFFFFF;--ink:#111111;--ink2:#3A3A40;--muted:#5C5C63;--line:#E6E2D9;--yellow:#FFD84D;--warn:#F9DEDC}
@media (prefers-color-scheme:dark){:root{--page:#141311;--surface:#1E1D1B;--ink:#F2F0EA;--ink2:#CFCDC6;--muted:#A9A59C;--line:#34322E;--yellow:#F5CE3E;--warn:#3D1714}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
header a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:10px}
.wordmark{font:800 26px/1 ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.5px}
.wordmark i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);margin-left:3px}
h1{font:800 34px/1.15 ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:-.5px;margin:8px 0 8px}
h2{font-size:15px;font-weight:600;color:var(--ink2);margin:28px 0 8px}
.card{background:var(--surface);border-radius:24px;padding:16px 20px}
.card p{margin:0 0 10px;color:var(--ink2)}.card p:last-child{margin:0}
.muted{color:var(--muted);font-size:14px}
.ph{font-family:ui-monospace,Menlo,monospace;font-weight:600;background:var(--warn);color:var(--ink);padding:1px 6px;border-radius:6px}
.ticket{background:var(--yellow);color:#111;border-radius:24px;padding:20px;margin:16px 0;position:relative}
.ticket b{font:800 44px/1 ui-rounded,-apple-system,system-ui,sans-serif}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
nav a{background:var(--surface);color:var(--ink);text-decoration:none;border-radius:999px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;font-weight:600;font-size:15px;border:1px solid var(--line)}
ul{padding-left:20px;color:var(--ink2)}li{margin-bottom:6px}
a{color:var(--ink)}
</style></head>
